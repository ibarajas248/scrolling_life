<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>contacto.command — Juliana Castro Duperly</title>
  <meta name="description" content="contacto.command — video de Juliana Castro Duperly." />
  <style>
    :root {
      color-scheme: dark;
      background: #000;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      display: grid;
      place-items: center;
    }

    .video-stage {
      position: fixed;
      inset: 0;
      display: grid;
      width: 100vw;
      height: 100dvh;
      place-items: center;
      background: #000;
    }

    .video-stage video {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
      object-fit: contain;
    }

    /* En móviles verticales, el lienzo gira para presentar la pieza horizontalmente. */
    @media (orientation: portrait) and (max-width: 900px) {
      .video-stage {
        top: 50%;
        right: auto;
        bottom: auto;
        left: 50%;
        width: 100dvh;
        height: 100vw;
        transform: translate(-50%, -50%) rotate(90deg);
        transform-origin: center;
      }
    }
  </style>
</head>
<body>
  <main class="video-stage" aria-label="Video de contacto.command">
    <video autoplay loop muted playsinline preload="auto">
      <source src="./contacto.command.castroduperly.mp4" type="video/mp4" />
      Tu navegador no puede reproducir este video.
    </video>
  </main>
</body>
</html>
