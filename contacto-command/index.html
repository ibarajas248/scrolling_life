<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>contacto.command — Juliana Castro Duperly</title>
  <meta name="description" content="contacto.command — video de Juliana Castro Duperly." />
  <style>
    :root {
      color-scheme: dark;
      background: #000;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      display: grid;
      place-items: center;
      background: #fff;
      transition: background 180ms ease;
    }

    body.is-accepted {
      background: #000;
    }

    .consent-dialog {
      position: fixed;
      top: 50%;
      left: 50%;
      width: min(445px, calc(100vw - 40px));
      height: 132px;
      overflow: hidden;
      border: 2px solid #696970;
      border-radius: 12px;
      background: #25252d;
      box-shadow: 0 25px 35px rgb(0 0 0 / 34%), 0 5px 12px rgb(0 0 0 / 22%);
      transform: translate(-50%, -50%);
      z-index: 10;
    }

    .consent-dialog__bar {
      height: 29px;
      border-bottom: 1px solid #19191e;
      background: #3b3b42;
    }

    .consent-dialog__body {
      position: relative;
      height: 99px;
      padding: 22px 19px;
      color: #ededf0;
      font: 600 14px/1.3 Arial, Helvetica, sans-serif;
    }

    .consent-dialog__body p {
      margin: 0;
      white-space: nowrap;
    }

    .consent-dialog__accept {
      position: absolute;
      right: 20px;
      bottom: 19px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      width: 84px;
      height: 21px;
      padding: 0;
      border: 0;
      border-radius: 5px;
      color: #fff;
      background: #1687e8;
      box-shadow: inset 0 1px rgb(255 255 255 / 14%);
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      transition: background 140ms ease, transform 140ms ease;
    }

    .consent-dialog__accept:hover {
      background: #2a9af0;
      transform: translateY(-1px);
    }

    .consent-dialog__accept:focus-visible {
      outline: 3px solid #1687e8;
      outline-offset: 3px;
    }

    .consent-dialog[hidden],
    body:not(.is-accepted) .video-stage {
      display: none;
    }

    .video-stage {
      position: fixed;
      inset: 0;
      display: grid;
      width: 100vw;
      height: 100dvh;
      place-items: center;
      background: #000;
    }

    .video-stage video {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
      object-fit: contain;
    }

    /* En móviles verticales, el lienzo gira para presentar la pieza horizontalmente. */
    @media (orientation: portrait) and (max-width: 900px) {
      .video-stage {
        top: 50%;
        right: auto;
        bottom: auto;
        left: 50%;
        width: 100dvh;
        height: 100vw;
        transform: translate(-50%, -50%) rotate(90deg);
        transform-origin: center;
      }
    }

    @media (max-width: 520px) {
      .consent-dialog {
        height: 142px;
      }

      .consent-dialog__body {
        height: 109px;
        padding: 20px 17px;
      }

      .consent-dialog__body p {
        max-width: 260px;
        white-space: normal;
      }

      .consent-dialog__accept {
        right: 17px;
        bottom: 17px;
      }
    }
  </style>
</head>
<body>
  <section class="consent-dialog" id="consent-dialog" aria-labelledby="consent-copy">
    <div class="consent-dialog__bar" aria-hidden="true"></div>
    <div class="consent-dialog__body">
      <p id="consent-copy">Este es el espacio donde nuestro tacto podría encontrarse.</p>
      <button class="consent-dialog__accept" id="consent-accept" type="button" aria-label="Aceptar">
        <span aria-hidden="true">👐</span>
        <span>Aceptar</span>
      </button>
    </div>
  </section>
  <main class="video-stage" aria-label="Video de contacto.command">
    <video id="contact-video" loop playsinline preload="auto">
      <source src="./contacto.command.castroduperly.mp4" type="video/mp4" />
      Tu navegador no puede reproducir este video.
    </video>
  </main>
  <script>
    const video = document.getElementById('contact-video');
    const consentDialog = document.getElementById('consent-dialog');
    const consentButton = document.getElementById('consent-accept');

    consentButton.addEventListener('click', async () => {
      document.body.classList.add('is-accepted');
      consentDialog.hidden = true;
      video.muted = false;
      video.volume = 1;

      try {
        await video.play();
      } catch {
        video.controls = true;
      }
    });
  </script>
</body>
</html>
