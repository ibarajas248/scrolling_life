<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Scroll en construcción - Scrolling Life</title>
  <meta
    name="description"
    content="Scrolling Life se encuentra temporalmente en mantenimiento."
  />
  <link rel="stylesheet" href="../assets/fonts/local-fonts.css" />
  <link rel="stylesheet" href="./styles.css" />
  <script src="../assets/scripts/maintenance-gate.js" defer></script>
</head>
<body>
  <main class="maintenance-screen" aria-labelledby="maintenanceTitle">
    <div class="maintenance-archive" aria-hidden="true">
      <span class="strip strip-a"></span>
      <span class="strip strip-b"></span>
      <span class="strip strip-c"></span>
      <span class="strip strip-d"></span>
      <span class="strip strip-i"></span>
      <span class="strip strip-j"></span>
      <span class="strip strip-k"></span>
      <span class="strip strip-l"></span>
      <span class="strip strip-e"></span>
      <span class="strip strip-f"></span>
      <span class="strip strip-g"></span>
      <span class="strip strip-h"></span>
      <span class="maintenance-spotlight"></span>
    </div>

    <section class="maintenance-copy">
      <p class="maintenance-award">&gt; Proyecto ganador de la Beca de Programación Virtual en Artes Plásticas y Visuales Red Galería Santa Fe 2026</p>
      <h1 id="maintenanceTitle">Scroll en construcción</h1>
      <p class="maintenance-author">Iván Barajas</p>
      <div class="maintenance-countdown" aria-live="off" data-countdown>
        <p class="countdown-label">Inauguración</p>
        <p class="countdown-date">17 septiembre 2026 · 5:00 p.m. Colombia</p>
        <div class="countdown-grid" aria-label="Tiempo restante para la inauguración">
          <span class="countdown-cell">
            <strong data-countdown-days>00</strong>
            <small>días</small>
          </span>
          <span class="countdown-cell">
            <strong data-countdown-hours>00</strong>
            <small>horas</small>
          </span>
          <span class="countdown-cell">
            <strong data-countdown-minutes>00</strong>
            <small>min</small>
          </span>
          <span class="countdown-cell">
            <strong data-countdown-seconds>00</strong>
            <small>seg</small>
          </span>
        </div>
      </div>
    </section>
  </main>
  <script>
    const countdown = document.querySelector('[data-countdown]');
    const countdownTarget = new Date('2026-09-17T17:00:00-05:00').getTime();
    const countdownParts = {
      days: document.querySelector('[data-countdown-days]'),
      hours: document.querySelector('[data-countdown-hours]'),
      minutes: document.querySelector('[data-countdown-minutes]'),
      seconds: document.querySelector('[data-countdown-seconds]'),
    };

    const formatTimePart = (value) => String(value).padStart(2, '0');

    const updateCountdown = () => {
      if (!countdown || Object.values(countdownParts).some((node) => !node)) return;

      const remaining = Math.max(0, countdownTarget - Date.now());
      const totalSeconds = Math.floor(remaining / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      countdownParts.days.textContent = formatTimePart(days);
      countdownParts.hours.textContent = formatTimePart(hours);
      countdownParts.minutes.textContent = formatTimePart(minutes);
      countdownParts.seconds.textContent = formatTimePart(seconds);

      if (remaining === 0) {
        countdown.dataset.countdownComplete = 'true';
        const label = countdown.querySelector('.countdown-label');
        if (label) label.textContent = 'Inauguración en curso';
      }
    };

    updateCountdown();
    window.setInterval(updateCountdown, 1000);

    const maintenanceScreen = document.querySelector('.maintenance-screen');
    const maintenanceArchive = document.querySelector('.maintenance-archive');

    if (maintenanceScreen && maintenanceArchive) {
      const canTrackPointer = window.matchMedia?.('(hover: hover) and (pointer: fine)').matches ?? true;
      let pendingPointer = null;
      let rafId = null;

      const updateSpotlight = () => {
        rafId = null;
        if (!pendingPointer) return;

        const rect = maintenanceArchive.getBoundingClientRect();
        const x = ((pendingPointer.clientX - rect.left) / rect.width) * 100;
        const y = ((pendingPointer.clientY - rect.top) / rect.height) * 100;

        maintenanceArchive.style.setProperty('--archive-cursor-x', `${Math.min(100, Math.max(0, x)).toFixed(2)}%`);
        maintenanceArchive.style.setProperty('--archive-cursor-y', `${Math.min(100, Math.max(0, y)).toFixed(2)}%`);
      };

      const requestSpotlightUpdate = (event) => {
        pendingPointer = event;
        if (!rafId) {
          rafId = window.requestAnimationFrame(updateSpotlight);
        }
      };

      if (canTrackPointer) {
        maintenanceScreen.addEventListener('pointerenter', (event) => {
          maintenanceArchive.classList.add('is-pointer-active');
          requestSpotlightUpdate(event);
        }, { passive: true });

        maintenanceScreen.addEventListener('pointermove', requestSpotlightUpdate, { passive: true });

        maintenanceScreen.addEventListener('pointerleave', () => {
          maintenanceArchive.classList.remove('is-pointer-active');
          pendingPointer = null;

          if (rafId) {
            window.cancelAnimationFrame(rafId);
            rafId = null;
          }
        });
      }
    }
  </script>

  <!-- Cloudflare Web Analytics -->
  <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "4ae4ff73465943b788027815f6676ab3"}'></script>
  <!-- End Cloudflare Web Analytics -->
  <script src="/assets/scripts/traffic-tracker.js" defer></script>
</body>
</html>
