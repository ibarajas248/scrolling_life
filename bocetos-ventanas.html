<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cuatro ventanas posibles — Scrolling Life</title>
<link rel="icon" href="./assets/favicon.svg">
<link rel="stylesheet" href="./assets/fonts/local-fonts.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#090b0b;color:#e9eee7;font-family:'Bricolage Grotesque',Arial,sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}header{padding:30px 4vw 22px;border-bottom:1px solid #343933;background:#101310}header small{font:12px 'Share Tech Mono',monospace;color:#9eff71;letter-spacing:.15em}h1{font-size:clamp(24px,3vw,40px);margin:10px 0 8px;font-weight:500}header p{color:#abb3a9;margin:0;font-size:15px}nav{position:sticky;top:0;z-index:20;display:flex;gap:8px;padding:14px 4vw;flex-wrap:wrap;background:#101310f5;border-bottom:1px solid #343933}nav button{border:1px solid #465043;color:#c6cec2;background:transparent;padding:9px 14px;font:14px 'Share Tech Mono',monospace}nav button[aria-pressed=true]{background:#9eff71;border-color:#9eff71;color:#091006}button:focus-visible,a:focus-visible{outline:3px solid #f18cff;outline-offset:5px}section[hidden]{display:none}section{padding:36px 4vw 48px;border-bottom:1px solid #343933}.section-head{display:flex;align-items:baseline;gap:16px;margin:0 auto 24px;max-width:1280px}.section-head b{color:#9eff71;font:26px 'Share Tech Mono',monospace}.section-head h2{font-size:25px;font-weight:500;margin:0}.section-head p{margin:0 0 0 auto;color:#a7b2a3;font-size:14px;max-width:420px}.desktop{position:relative;max-width:1280px;margin:auto;padding:36px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;background:#111614;isolation:isolate;overflow:hidden}.desktop:before{content:'';position:absolute;inset:0;background:linear-gradient(#060909b8,#060909e8),url('./assets/images/archive-sides/vertical-contact-strips.png') center/cover;z-index:-1;opacity:.6}.window{min-width:0;position:relative;transition:transform .18s,box-shadow .18s}.window:hover{transform:translateY(-5px)}.bar{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;font:11px 'Share Tech Mono',monospace;letter-spacing:.02em}.file-icon{display:inline-block;width:10px;height:12px;background:currentColor;clip-path:polygon(0 0,65% 0,100% 30%,100% 100%,0 100%)}.controls{margin-left:auto;display:flex;gap:4px;font-family:monospace}.controls i{font-style:normal;text-align:center;width:17px;height:17px;line-height:15px}.inside{display:flex;flex-direction:column;padding:24px;min-height:390px}.category{font:11px 'Share Tech Mono',monospace;letter-spacing:.12em;text-transform:uppercase}h3{margin:8px 0 14px;font-size:36px;line-height:1.05;font-weight:500}.art{display:flex;align-items:center;justify-content:center;height:126px;margin:0 0 18px;position:relative}.art img{max-height:120px;max-width:76%;object-fit:contain;image-rendering:pixelated}.copy{font-size:16px;line-height:1.55;margin:0 0 24px;max-width:29ch;min-height:100px}.go{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;text-decoration:none;padding:12px 14px;font:14px 'Share Tech Mono',monospace}.status{font:10px 'Share Tech Mono',monospace;letter-spacing:.08em}.window:nth-child(1){--accent:#9eff71}.window:nth-child(2){--accent:#77def5}.window:nth-child(3){--accent:#f2a47e}
/* 01: a quieter Windows desktop, with one clear reading column. */
.classic .window{padding:4px;background:#c6c7c1;box-shadow:inset 2px 2px #fff,inset -2px -2px #65685f,7px 9px 0 #0007;color:#161b16}.classic .bar{background:linear-gradient(90deg,#06046e,#0968b6);color:#fff}.classic .controls i{color:#171b19;background:#c6c7c1;box-shadow:inset 1px 1px #fff,inset -1px -1px #555}.classic .inside{background:#f6f5ed;margin-top:4px;border:1px solid #85877f}.classic .category{color:#687062}.classic h3{font-weight:700;font-size:32px}.classic .art{border-bottom:1px dotted #bdc0b4}.classic .go{background:#dedfd5;color:#172010;border:1px solid #777e6e;box-shadow:inset 1px 1px #fff}.classic .go:hover{background:#c9edb5}.classic .status{padding:6px 8px 2px;color:#454c3d}
/* 02: black technical windows, the images remain the brightest objects. */
.terminal .window{background:#080d0b;color:#dce4d8;border:1px solid #52614e;box-shadow:6px 6px 0 #000}.terminal .bar{border-bottom:1px solid #394836;color:var(--accent)}.terminal .controls{color:#7b8a75}.terminal .category{color:#788970}.terminal h3{font-family:'Disket Mono',monospace;font-size:27px;color:var(--accent);margin-top:14px}.terminal .art{background:radial-gradient(ellipse at center,#29372880,transparent 70%)}.terminal .copy{color:#c1cdbc}.terminal .go{padding:12px 0;color:var(--accent);border-top:1px solid #394836}.terminal .go:hover{background:#1d291a}.terminal .status{color:#788970;padding:10px 24px;border-top:1px solid #283225}
/* 03: editorial file windows, bold flat fields and larger images. */
.paper .desktop{gap:30px;padding:44px 36px}.paper .window{background:#eee9d9;color:#1a231b;border:2px solid #10190f;box-shadow:8px 8px 0 #050805}.paper .window:nth-child(1){--paper:#d6f3ac}.paper .window:nth-child(2){--paper:#bde8ef}.paper .window:nth-child(3){--paper:#f3c6b4}.paper .bar{background:var(--paper);border-bottom:2px solid #10190f}.paper .controls i{border:1px solid #10190f}.paper .inside{padding:0 24px 24px}.paper .category{padding-top:22px;color:#5d6657}.paper h3{font:48px 'Instrument Serif',Georgia,serif;margin-bottom:16px}.paper .art{order:-1;background:var(--paper);margin:0 -24px;height:154px;border-bottom:2px solid #10190f}.paper .art img{max-height:142px}.paper .go{background:#192318;color:#eefaed;border:1px solid #192318}.paper .go:hover{background:#344b2d}.paper .status{padding:9px 24px;border-top:1px solid #10190f;font-size:11px}
/* 04: stripped-back blue OS, large numbers and graphic navigation. */
.blue .desktop{background:#0c11a0}.blue .desktop:before{opacity:.15}.blue .window{background:#ebf0e8;border:1px solid #eef4e9;box-shadow:8px 8px 0 #03064f;color:#081588}.blue .bar{height:38px;color:#ebf0e8;background:#0d17b5;border-bottom:1px solid #eef4e9}.blue .controls i{border:1px solid #9da7fa}.blue .inside{position:relative;overflow:hidden;padding:26px}.blue .category{color:#081588}.blue h3{font-size:41px;letter-spacing:-.06em;font-weight:700}.blue .art{justify-content:flex-end;margin-bottom:20px}.blue .art:before{content:attr(data-number);position:absolute;left:0;bottom:-8px;font:110px/1 'Instrument Serif',Georgia,serif;color:#1529bf22}.blue .art img{max-width:60%;z-index:1}.blue .copy{font-size:16px;color:#182443}.blue .go{margin-left:-26px;margin-right:-26px;margin-bottom:-26px;background:#b3ff57;border-top:1px solid #081588;color:#081588;padding:17px 26px;font-weight:bold}.blue .go:hover{background:#95ed30}.blue .status{padding:8px 12px;background:#0d17b5;color:#ccd4ff}
footer{padding:26px 4vw;color:#9aa695;font:13px 'Share Tech Mono',monospace}@media(max-width:950px){.desktop{padding:20px;gap:15px}.inside{padding:18px}.copy{font-size:15px}.bar{font-size:9px}.controls i{width:13px}.paper .desktop{padding:24px;gap:16px}.section-head{flex-wrap:wrap}.section-head p{margin-left:0;max-width:none;width:100%}}@media(max-width:700px){.desktop{grid-template-columns:1fr;max-width:410px}.inside{min-height:0}.copy{min-height:0}.window{margin-bottom:14px}.section-head h2{font-size:22px}.section-head b{font-size:22px}nav{gap:5px}nav button{font-size:12px;padding:8px}.paper .desktop{padding:20px}.desktop:before{background-size:auto 100%}}
</style>
</head>
<body>
<header><small>SCROLLING LIFE / ESTUDIO DE VENTANAS</small><h1>Cuatro formas de abrir el recorrido.</h1><p>Bocetos para comparar. El home actual sigue igual.</p></header>
<nav aria-label="Comparar bocetos"><button data-filter="all" aria-pressed="true">Ver los cuatro</button><button data-filter="classic" aria-pressed="false">01 · Windows 98</button><button data-filter="terminal" aria-pressed="false">02 · Terminal</button><button data-filter="paper" aria-pressed="false">03 · Archivo editorial</button><button data-filter="blue" aria-pressed="false">04 · Ultramar</button></nav>
<main id="proposals"></main>
<footer>Las tres ventanas muestran el mismo contenido en cada propuesta. El diseño elegido se extenderá también a Archivo y Pausa.</footer>
<script>
const variants=[['classic','01','Windows 98, más limpio','Conserva lo retro, ordena la lectura y da aire a las imágenes.'],['terminal','02','Terminal nocturna','Negro, líneas finas y acentos de color para dialogar con el home.'],['paper','03','Archivo editorial','Ventanas como fichas de exposición: color, imagen y tipografía expresiva.'],['blue','04','Sistema ultramar','Azul eléctrico y verde ácido; una interfaz más gráfica y compacta.']];
const items=[{name:'Cuerpo',file:'CUERPO.TXT',image:'cuerpo-scroll-ultramar-transparent.png',text:'El cuerpo también hace scroll… toca, obedece, se fatiga, deja rastros.',url:'cuerpo',kind:'gesto / superficie'},{name:'Infinito',file:'INFINITO.SYS',image:'infinito-network-transparent.png',text:'Entramos a mirar una cosa y terminamos en otra. Nunca llegamos al fondo.',url:'infinito',kind:'deseo / recorrido'},{name:'Ruido',file:'RUIDO.DLL',image:'ruido-window-transparent.png',text:'Una noticia, un meme, alguien vendiendo algo. Todo aparece junto, aunque no tenga nada que ver.',url:'ruido',kind:'señal / interferencia'}];
const container=document.getElementById('proposals');
container.innerHTML=variants.map(([style,num,title,desc])=>`<section class="${style}" id="${style}"><div class="section-head"><b>${num}</b><h2>${title}</h2><p>${desc}</p></div><div class="desktop">${items.map((item,i)=>`<article class="window"><div class="bar"><span class="file-icon" aria-hidden="true"></span><span>C:\\SCROLL\\${item.file}</span><span class="controls" aria-hidden="true"><i>−</i><i>□</i><i>×</i></span></div><div class="inside"><span class="category">${item.kind}</span><h3>${item.name}</h3><div class="art" data-number="0${i+1}"><img src="./assets/images/${item.image}" alt="" /></div><p class="copy">${item.text}</p><a class="go" href="./pages/${item.url}/" target="_blank" rel="noopener"><span>Abrir ${item.name}</span><span aria-hidden="true">↗</span></a></div><div class="status">SCROLLING LIFE · 0${i+1} / 05</div></article>`).join('')}</div></section>`).join('');
document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.querySelectorAll('main>section').forEach(section=>section.hidden=button.dataset.filter!=='all'&&section.id!==button.dataset.filter);window.scrollTo({top:0,behavior:'instant'});}));
</script>
</body>
</html>
