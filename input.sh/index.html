<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=20260917" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b09">
  <title>input.sh — Scrolling Life</title>
  <link rel="stylesheet" href="./style.css?v=2">
  <script src="./script.js?v=2" defer></script>
</head>
<body>
  <main class="terminal" id="terminal-scroll" tabindex="0" aria-label="Historial de la consola">
    <div class="intro"><p><span class="user">visitante@scrollinglife</span> <span class="shell">MINGW64</span> <span class="path">~/input.sh</span> <span class="branch">(main)</span></p><p>$ ./input.sh</p><p class="muted">Consola compartida. Cada línea deja un rastro.<br>Enter envía · Shift + Enter añade una línea.</p></div>
    <section aria-label="Historial compartido, entradas nuevas al final"><div id="feed"></div></section>
    <form id="console-form">
      <p class="prompt"><span class="user">visitante@scrollinglife</span> <span class="shell">MINGW64</span> <span class="path">~/input.sh</span> <span class="branch">(main)</span></p>
      <div class="input-line"><label for="input"><span aria-hidden="true">$</span><span class="sr-only">Escribe en la consola</span></label><textarea id="input" name="text" maxlength="2000" rows="1" placeholder="escribe aquí…" required spellcheck="false" aria-describedby="hint"></textarea><button type="submit" aria-label="Enviar texto">↵</button></div>
    </form>
  </main>
  <button id="latest" hidden>↓ volver a lo último</button>
  <div class="sr-only"><span id="status" role="status" aria-live="polite">conectando…</span><span id="count">0 / 2000</span><span id="hint">público · últimas 500 entradas</span></div>
</body>
</html>
