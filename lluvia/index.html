  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lluvia</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: linear-gradient(180deg, #020304 0%, #080a0f 45%, #06070a 100%); }
    .netart-layer { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
    .netart-item {
      position: absolute;
      background-size: cover;
      background-position: center;
      will-change: transform, opacity;
      filter: saturate(1.22) contrast(1.08) brightness(1.08);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.22);
      transition: opacity 0.3s ease;
    }
  </style>

  <div class="netart-layer" aria-hidden="true"></div>
