<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Net Art Scroll</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      overflow-x: hidden;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.08), transparent 30%),
        linear-gradient(180deg, #cfd8d2 0%, #bcc9c0 30%, #94a89c 60%, #71877e 100%);
      color: #1c2a24;
    }

    body {
      position: relative;
    }

    /* capa atmosférica */
    .mist {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.25;
      background:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.35), transparent 18%),
        radial-gradient(circle at 70% 20%, rgba(255,255,255,0.20), transparent 20%),
        radial-gradient(circle at 50% 70%, rgba(255,255,255,0.15), transparent 22%);
      filter: blur(30px);
      animation: mistMove 16s ease-in-out infinite alternate;
    }

    @keyframes mistMove {
      from { transform: translateY(0px) translateX(0px) scale(1); }
      to   { transform: translateY(-20px) translateX(10px) scale(1.08); }
    }

    /* textos flotando */
    .floating-texts {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .floating-text {
      position: absolute;
      color: rgba(20, 35, 28, 0.28);
      font-size: clamp(14px, 1.4vw, 22px);
      font-style: italic;
      letter-spacing: 0.5px;
      white-space: nowrap;
      animation-name: drift;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      text-shadow: 0 0 8px rgba(255,255,255,0.12);
    }

    @keyframes drift {
      0% {
        transform: translateX(-20vw) translateY(0px) rotate(-2deg);
        opacity: 0;
      }
      10% { opacity: 1; }
      50% {
        transform: translateX(50vw) translateY(-20px) rotate(2deg);
        opacity: 0.8;
      }
      100% {
        transform: translateX(120vw) translateY(15px) rotate(-1deg);
        opacity: 0;
      }
    }

    /* imágenes fantasma de fondo */
    .ghost-layer {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .ghost-img {
      position: absolute;
      width: 140px;
      opacity: 0.12;
      filter: blur(1px) saturate(0.9);
      animation: floatGhost linear infinite;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    @keyframes floatGhost {
      0% {
        transform: translateY(110vh) translateX(0px) rotate(0deg) scale(0.95);
        opacity: 0;
      }
      15% {
        opacity: 0.12;
      }
      50% {
        transform: translateY(50vh) translateX(20px) rotate(4deg) scale(1);
        opacity: 0.18;
      }
      100% {
        transform: translateY(-20vh) translateX(-10px) rotate(-3deg) scale(1.04);
        opacity: 0;
      }
    }

    /* contenedor principal */
    .page {
      position: relative;
      z-index: 2;
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 40px 16px 80px;
    }

    .image-container {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .intro {
      margin-bottom: 22px;
      padding: 18px 20px;
      background: rgba(146, 25, 25, 0.18);
      border: 1px solid rgba(255,255,255,0.22);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .intro h1 {
      margin: 0 0 8px;
      font-size: 1.4rem;
      font-weight: normal;
      letter-spacing: 0.5px;
    }

    .intro p {
      margin: 0;
      line-height: 1.5;
      font-size: 0.95rem;
      color: rgba(20, 35, 28, 0.85);
    }

    .image-item {
      width: 100%;
      overflow: hidden;
      border-radius: 14px;
      background: rgba(255,255,255,0.10);
      box-shadow: 0 12px 28px rgba(0,0,0,0.10);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .image-item:hover {
      transform: scale(1.01);
      box-shadow: 0 18px 34px rgba(0,0,0,0.14);
    }

    .image-item img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    .footer-note {
      margin-top: 20px;
      text-align: center;
      font-size: 0.9rem;
      color: rgba(20, 35, 28, 0.75);
      font-style: italic;
    }

    .video-overlay[hidden] {
      display: none;
    }

    .video-overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(12, 22, 18, 0.68);
      backdrop-filter: blur(10px);
    }

    .video-modal {
      position: relative;
      width: min(92vw, 720px);
      border-radius: 20px;
      overflow: hidden;
      background: rgba(18, 28, 23, 0.94);
      border: 1px solid rgba(255,255,255,0.16);
      box-shadow: 0 26px 70px rgba(0,0,0,0.35);
    }

    .video-frame-wrap {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
    }

    .video-frame-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .video-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      font-size: 1.25rem;
      line-height: 1;
      color: #12211a;
      background: rgba(255,255,255,0.92);
      box-shadow: 0 8px 18px rgba(0,0,0,0.18);
    }

    .video-caption {
      margin: 0;
      padding: 14px 18px 18px;
      font-size: 0.92rem;
      line-height: 1.45;
      color: rgba(238, 243, 240, 0.88);
    }

    .video-reopen {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 25;
      border: 0;
      border-radius: 999px;
      padding: 12px 16px;
      cursor: pointer;
      font: inherit;
      color: #f4f1eb;
      background: rgba(24, 40, 32, 0.86);
      box-shadow: 0 14px 30px rgba(0,0,0,0.18);
      backdrop-filter: blur(8px);
    }

    .video-reopen[hidden] {
      display: none;
    }

    @media (max-width: 700px) {
      .ghost-img {
        width: 90px;
      }

      .floating-text {
        font-size: 14px;
      }

      .page {
        padding-top: 24px;
      }

      .video-overlay {
        padding: 12px;
      }

      .video-close {
        top: 10px;
        right: 10px;
      }

      .video-reopen {
        right: 12px;
        bottom: 12px;
      }
    }
  </style>
</head>
<body>

  <div class="mist"></div>

  <div class="floating-texts" id="floating-texts"></div>
  <div class="ghost-layer" id="ghost-layer"></div>

  <div class="video-overlay" id="video-overlay" hidden>
    <section class="video-modal" aria-label="Video emergente de YouTube" role="dialog" aria-modal="true">
      <button class="video-close" id="video-close-button" type="button" aria-label="Cerrar video">
        &times;
      </button>
      <div class="video-frame-wrap">
        <iframe
          id="youtube-popup-frame"
          title="Video emergente"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen
        ></iframe>
      </div>
      <p class="video-caption">
        Puedes cerrar este video cuando quieras para seguir viendo la pagina.
      </p>
    </section>
  </div>

  <button class="video-reopen" id="video-open-button" type="button" hidden>
    Abrir video
  </button>

  <main class="page">
    <div class="image-container" id="image-container">
      <section class="intro">
        <h1>Sedimentos</h1>
        <p>
          Imágenes extraídas de Instagram se acumulan en esta tira como sedimentos de una imaginación compartida alrededor de #StudioGhibli.
        </p>
      </section>
    </div>
  </main>

  <script>

    const floatingTexts = document.getElementById("floating-texts");
    const ghostLayer = document.getElementById("ghost-layer");
    const videoOverlay = document.getElementById("video-overlay");
    const videoFrame = document.getElementById("youtube-popup-frame");
    const videoCloseButton = document.getElementById("video-close-button");
    const videoOpenButton = document.getElementById("video-open-button");

    const totalImages = 100;
    const baseUrl = "https://ibarajas248.github.io/scrolleandowdwd/imagen";
    const youtubeVideoUrl = "https://youtu.be/vOrh8h4npq8";

    // Frases flotantes
    const frases = [
      "el scroll también sueña",
      "mirar es demorarse",
      "la imagen no termina",
      "todo fondo tiene memoria",
      "la interfaz respira",
      "la niebla digital piensa",
      "deslizar también es recordar",
      "una poética de la demora",
      "fantasmas en la superficie",
      "la pantalla como paisaje",
      "la deriva visual no concluye",

      "el gesto mínimo del dedo",

      "ojos cansados, mundo sensible",

      "la imagen flota antes de aparecer"
    ];

    function loadImages() {
      for (let i = 1; i <= totalImages; i++) {
        const imageItem = document.createElement("div");
        imageItem.className = "image-item";

        const img = document.createElement("img");
        img.src = `${baseUrl}/imagen_${i}.jpg`;
        img.alt = `Imagen ${i}`;
        img.loading = "lazy";

        img.onerror = function () {
          imageItem.remove();
        };

        imageItem.appendChild(img);
        imageContainer.appendChild(imageItem);
      }

      const note = document.createElement("div");
      note.className = "footer-note";
      note.textContent = "seguir bajando también es una forma de pensar";
      imageContainer.appendChild(note);
    }

    function createFloatingTexts() {
      for (let i = 0; i < 18; i++) {
        const el = document.createElement("div");
        el.className = "floating-text";
        el.textContent = frases[i % frases.length];

        el.style.top = `${Math.random() * 90}%`;
        el.style.left = `${Math.random() * 20 - 20}%`;
        el.style.animationDuration = `${18 + Math.random() * 20}s`;
        el.style.animationDelay = `${Math.random() * 12}s`;
        el.style.fontSize = `${14 + Math.random() * 14}px`;

        floatingTexts.appendChild(el);
      }
    }

    function createGhostImages() {
      for (let i = 1; i <= 10; i++) {
        const ghost = document.createElement("img");
        const n = 1 + Math.floor(Math.random() * totalImages);

        ghost.src = `${baseUrl}/imagen_${n}.jpg`;
        ghost.className = "ghost-img";
        ghost.alt = "fantasma visual";

        ghost.style.left = `${Math.random() * 100}%`;
        ghost.style.animationDuration = `${20 + Math.random() * 20}s`;
        ghost.style.animationDelay = `${Math.random() * 15}s`;
        ghost.style.width = `${80 + Math.random() * 120}px`;

        ghost.onerror = function () {
          ghost.remove();
        };

        ghostLayer.appendChild(ghost);
      }
    }

    function getYoutubeEmbedUrl(url) {
      if (!url) {
        return "";
      }

      let videoId = "";

      try {
        const parsedUrl = new URL(url);
        const host = parsedUrl.hostname.replace("www.", "");

        if (host === "youtu.be") {
          videoId = parsedUrl.pathname.slice(1);
        } else if (host.includes("youtube.com")) {
          videoId = parsedUrl.searchParams.get("v") || "";

          if (!videoId && parsedUrl.pathname.startsWith("/embed/")) {
            videoId = parsedUrl.pathname.split("/embed/")[1] || "";
          }

          if (!videoId && parsedUrl.pathname.startsWith("/shorts/")) {
            videoId = parsedUrl.pathname.split("/shorts/")[1] || "";
          }
        }
      } catch (error) {
        videoId = "";
      }

      if (!videoId) {
        return "";
      }

      return `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1&playsinline=1`;
    }

    function closeVideoPopup() {
      videoOverlay.hidden = true;
      videoOpenButton.hidden = false;
      videoFrame.src = "";
    }

    function openVideoPopup() {
      const embedUrl = getYoutubeEmbedUrl(youtubeVideoUrl);

      if (!embedUrl) {
        videoOverlay.hidden = true;
        videoOpenButton.hidden = true;
        return;
      }

      videoFrame.src = embedUrl;
      videoOverlay.hidden = false;
      videoOpenButton.hidden = true;
    }

    videoCloseButton.addEventListener("click", closeVideoPopup);
    videoOpenButton.addEventListener("click", openVideoPopup);
    videoOverlay.addEventListener("click", (event) => {
      if (event.target === videoOverlay) {
        closeVideoPopup();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !videoOverlay.hidden) {
        closeVideoPopup();
      }
    });

    loadImages();
    createFloatingTexts();
    createGhostImages();
    openVideoPopup();
  </script>
</body>
</html>
