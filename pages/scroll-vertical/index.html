<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101713" />
  <title>Sedimentos — Scroll vertical</title>
  <style>
    :root {
      --ink: #17231d;
      --paper: #d9dfda;
      --accent: #8e2424;
      --panel-width: 43vw;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      color: var(--ink);
      background: #070a08;
      font-family: Georgia, "Times New Roman", serif;
    }

    .experience-shell {
      display: grid;
      grid-template-columns: minmax(340px, var(--panel-width)) minmax(0, 1fr);
      width: 100%;
      height: 100dvh;
    }

    .scroll-panel {
      position: relative;
      z-index: 3;
      min-width: 0;
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-color: rgba(95, 118, 105, 0.9) rgba(230, 234, 230, 0.24);
      scrollbar-width: thin;
      background:
        radial-gradient(circle at 18% 8%, rgba(255, 255, 255, 0.48), transparent 25%),
        linear-gradient(180deg, #d7ded8 0%, #c2cec5 30%, #97aa9e 64%, #6f867b 100%);
      box-shadow: 22px 0 55px rgba(0, 0, 0, 0.34);
    }

    .scroll-panel::-webkit-scrollbar {
      width: 7px;
    }

    .scroll-panel::-webkit-scrollbar-track {
      background: rgba(230, 234, 230, 0.24);
    }

    .scroll-panel::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: rgba(95, 118, 105, 0.9);
    }

    .scroll-progress {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 12;
      width: 0;
      max-width: var(--panel-width);
      height: 3px;
      background: var(--accent);
      box-shadow: 0 0 16px rgba(142, 36, 36, 0.42);
      transition: width 80ms linear;
      pointer-events: none;
    }

    .mist,
    .floating-texts,
    .ghost-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .mist {
      z-index: 0;
      opacity: 0.3;
      background:
        radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.42), transparent 18%),
        radial-gradient(circle at 72% 18%, rgba(255, 255, 255, 0.25), transparent 22%),
        radial-gradient(circle at 50% 72%, rgba(255, 255, 255, 0.18), transparent 24%);
      filter: blur(30px);
      animation: mistMove 16s ease-in-out infinite alternate;
    }

    .floating-texts,
    .ghost-layer {
      position: fixed;
      right: auto;
      width: var(--panel-width);
      max-width: 100%;
      z-index: 1;
    }

    .floating-text {
      position: absolute;
      color: rgba(20, 35, 28, 0.22);
      font-size: clamp(13px, 1.2vw, 19px);
      font-style: italic;
      letter-spacing: 0.03em;
      white-space: nowrap;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.14);
      animation: drift linear infinite;
    }

    .ghost-img {
      position: absolute;
      width: 120px;
      border-radius: 2px;
      opacity: 0.1;
      filter: blur(1px) saturate(0.72);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.1);
      animation: floatGhost linear infinite;
    }

    .page {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: center;
      width: 100%;
      padding: clamp(38px, 6vw, 82px) clamp(18px, 4vw, 54px) 90px;
    }

    .image-container {
      display: flex;
      flex-direction: column;
      gap: 9px;
      width: 100%;
      max-width: 520px;
    }

    .intro {
      position: relative;
      margin-bottom: 18px;
      padding: 26px 25px 24px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.34);
      border-radius: 2px;
      background: rgba(238, 241, 237, 0.44);
      box-shadow: 0 20px 46px rgba(34, 53, 43, 0.13);
      backdrop-filter: blur(13px);
    }

    .intro::before {
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--accent);
      content: "";
    }

    .eyebrow {
      display: block;
      margin-bottom: 34px;
      color: rgba(23, 35, 29, 0.62);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.19em;
      text-transform: uppercase;
    }

    .intro h1 {
      margin: 0 0 11px;
      font-size: clamp(2.2rem, 5vw, 4.2rem);
      font-weight: 400;
      letter-spacing: -0.055em;
      line-height: 0.9;
    }

    .intro p {
      max-width: 34rem;
      margin: 0;
      color: rgba(20, 35, 28, 0.82);
      font-size: clamp(0.9rem, 1.25vw, 1rem);
      line-height: 1.55;
    }

    .scroll-cue {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 28px;
      color: rgba(23, 35, 29, 0.58);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .scroll-cue::before {
      width: 24px;
      height: 1px;
      background: currentColor;
      content: "";
    }

    .image-item {
      position: relative;
      width: 100%;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.19);
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 16px 34px rgba(21, 35, 28, 0.14);
      transform: translateZ(0);
      transition: box-shadow 400ms ease, transform 400ms ease;
    }

    .image-item:hover {
      z-index: 2;
      box-shadow: 0 22px 42px rgba(21, 35, 28, 0.22);
      transform: scale(1.012);
    }

    .image-item img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: cover;
    }

    .footer-note {
      margin-top: 24px;
      padding: 36px 10px 12px;
      border-top: 1px solid rgba(23, 35, 29, 0.24);
      color: rgba(20, 35, 28, 0.72);
      font-size: 0.9rem;
      font-style: italic;
      text-align: center;
    }

    .video-panel {
      position: relative;
      isolation: isolate;
      min-width: 0;
      height: 100%;
      overflow: hidden;
      background: #050706;
    }

    .video-frame {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 0;
      border: 0;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }

    .video-vignette {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(5, 7, 6, 0.34), transparent 12%, transparent 84%, rgba(5, 7, 6, 0.25)),
        linear-gradient(180deg, rgba(5, 7, 6, 0.9) 0%, rgba(5, 7, 6, 0.08) 14%, transparent 31%, transparent 72%, rgba(5, 7, 6, 0.93) 100%);
      box-shadow: inset 0 0 120px 18px rgba(2, 4, 3, 0.4);
    }

    .video-panel::before,
    .video-panel::after {
      position: absolute;
      right: 0;
      left: 0;
      z-index: 4;
      height: 12%;
      pointer-events: none;
      content: "";
    }

    .video-panel::before {
      top: 0;
      background: linear-gradient(180deg, #050706 0%, rgba(5, 7, 6, 0.76) 28%, transparent 100%);
    }

    .video-panel::after {
      bottom: 0;
      height: 16%;
      background: linear-gradient(0deg, #050706 0%, rgba(5, 7, 6, 0.84) 34%, transparent 100%);
    }

    .video-grain {
      position: absolute;
      inset: 0;
      z-index: 5;
      opacity: 0.15;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    @keyframes mistMove {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to { transform: translate3d(10px, -20px, 0) scale(1.08); }
    }

    @keyframes drift {
      0% { opacity: 0; transform: translateX(-20vw) translateY(0) rotate(-2deg); }
      10% { opacity: 1; }
      50% { opacity: 0.75; transform: translateX(22vw) translateY(-20px) rotate(2deg); }
      100% { opacity: 0; transform: translateX(55vw) translateY(15px) rotate(-1deg); }
    }

    @keyframes floatGhost {
      0% { opacity: 0; transform: translateY(110vh) translateX(0) rotate(0deg) scale(0.95); }
      15% { opacity: 0.1; }
      50% { opacity: 0.16; transform: translateY(50vh) translateX(20px) rotate(4deg) scale(1); }
      100% { opacity: 0; transform: translateY(-20vh) translateX(-10px) rotate(-3deg) scale(1.04); }
    }

    @media (max-width: 900px) {
      :root {
        --panel-width: 100vw;
      }

      body {
        overflow-y: auto;
      }

      .experience-shell {
        display: flex;
        height: auto;
        min-height: 100dvh;
        flex-direction: column;
      }

      .video-panel {
        position: sticky;
        top: 0;
        z-index: 2;
        order: 1;
        width: 100%;
        height: 46svh;
        min-height: 300px;
      }

      .scroll-panel {
        z-index: 3;
        order: 2;
        width: 100%;
        height: auto;
        overflow: visible;
        box-shadow: 0 -24px 58px rgba(0, 0, 0, 0.38);
      }

      .scroll-progress {
        position: fixed;
        top: 46svh;
        max-width: 100vw;
      }

      .floating-texts,
      .ghost-layer {
        position: absolute;
        width: 100%;
        height: 100vh;
      }

      .page {
        padding: 32px 14px 72px;
      }

      .intro h1 {
        font-size: clamp(2.75rem, 16vw, 5rem);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .mist,
      .floating-text,
      .ghost-img {
        animation: none;
      }

      .image-item {
        transition: none;
      }
    }
  </style>
  <script src="../../assets/scripts/maintenance-gate.js" defer></script>
</head>
<body>
  <main class="experience-shell">
    <section class="scroll-panel" id="scroll-panel" aria-labelledby="sedimentos-title">
      <div class="scroll-progress" id="scroll-progress" aria-hidden="true"></div>
      <div class="mist" aria-hidden="true"></div>
      <div class="floating-texts" id="floating-texts" aria-hidden="true"></div>
      <div class="ghost-layer" id="ghost-layer" aria-hidden="true"></div>

      <div class="page">
        <div class="image-container" id="image-container">
          <header class="intro">
            <span class="eyebrow">Archivo vertical · 001—100</span>
            <h1 id="sedimentos-title">Sedimentos</h1>
            <p>
              Imágenes extraídas de Instagram se acumulan en esta tira como sedimentos de una imaginación compartida alrededor de #StudioGhibli.
            </p>
            <span class="scroll-cue">desplazar para recorrer</span>
          </header>
        </div>
      </div>
    </section>

    <section class="video-panel" id="video-panel" aria-label="Video de la experiencia">
      <iframe
        class="video-frame"
        id="video-frame"
        title="Video de la experiencia"
        allow="autoplay; encrypted-media; picture-in-picture"
        referrerpolicy="strict-origin-when-cross-origin"
        tabindex="-1"
      ></iframe>
      <div class="video-vignette" aria-hidden="true"></div>
      <div class="video-grain" aria-hidden="true"></div>
    </section>
  </main>

  <script>
    const imageContainer = document.getElementById("image-container");
    const floatingTexts = document.getElementById("floating-texts");
    const ghostLayer = document.getElementById("ghost-layer");
    const scrollPanel = document.getElementById("scroll-panel");
    const scrollProgress = document.getElementById("scroll-progress");
    const videoPanel = document.getElementById("video-panel");
    const videoFrame = document.getElementById("video-frame");

    const totalImages = 100;
    const baseUrl = "https://ibarajas248.github.io/scrolleandowdwd/imagen";
    const youtubeVideoId = "vOrh8h4npq8";
    const videoAspectRatio = 16 / 9;
    const videoCrop = 1.12;

    const frases = [
      "el scroll también sueña",
      "mirar es demorarse",
      "la imagen no termina",
      "todo fondo tiene memoria",
      "la interfaz respira",
      "la niebla digital piensa",
      "deslizar también es recordar",
      "una poética de la demora",
      "fantasmas en la superficie",
      "la pantalla como paisaje",
      "la deriva visual no concluye",
      "ojos cansados, mundo sensible",
      "el gesto mínimo del dedo",
      "una melancolía de píxeles",
      "la imagen flota antes de aparecer"
    ];

    function loadImages() {
      for (let i = 1; i <= totalImages; i += 1) {
        const imageItem = document.createElement("div");
        const img = document.createElement("img");

        imageItem.className = "image-item";
        img.src = `${baseUrl}/imagen_${i}.jpg`;
        img.alt = `Imagen ${i}`;
        img.loading = i < 4 ? "eager" : "lazy";
        img.decoding = "async";
        img.onerror = () => imageItem.remove();

        imageItem.appendChild(img);
        imageContainer.appendChild(imageItem);
      }

      const note = document.createElement("div");
      note.className = "footer-note";
      note.textContent = "seguir bajando también es una forma de pensar";
      imageContainer.appendChild(note);
    }

    function createFloatingTexts() {
      for (let i = 0; i < 18; i += 1) {
        const element = document.createElement("span");
        element.className = "floating-text";
        element.textContent = frases[i % frases.length];
        element.style.top = `${Math.random() * 90}%`;
        element.style.left = `${Math.random() * 20 - 20}%`;
        element.style.animationDuration = `${18 + Math.random() * 20}s`;
        element.style.animationDelay = `${Math.random() * 12}s`;
        element.style.fontSize = `${13 + Math.random() * 8}px`;
        floatingTexts.appendChild(element);
      }
    }

    function createGhostImages() {
      for (let i = 0; i < 9; i += 1) {
        const ghost = document.createElement("img");
        const imageNumber = 1 + Math.floor(Math.random() * totalImages);
        ghost.src = `${baseUrl}/imagen_${imageNumber}.jpg`;
        ghost.className = "ghost-img";
        ghost.alt = "";
        ghost.style.left = `${Math.random() * 88}%`;
        ghost.style.animationDuration = `${20 + Math.random() * 20}s`;
        ghost.style.animationDelay = `${Math.random() * 15}s`;
        ghost.style.width = `${75 + Math.random() * 100}px`;
        ghost.onerror = () => ghost.remove();
        ghostLayer.appendChild(ghost);
      }
    }

    function fitVideoFrame() {
      const { width, height } = videoPanel.getBoundingClientRect();
      let frameWidth;
      let frameHeight;

      if (width / height > videoAspectRatio) {
        frameWidth = width * videoCrop;
        frameHeight = frameWidth / videoAspectRatio;
      } else {
        frameHeight = height * videoCrop;
        frameWidth = frameHeight * videoAspectRatio;
      }

      videoFrame.style.width = `${Math.ceil(frameWidth)}px`;
      videoFrame.style.height = `${Math.ceil(frameHeight)}px`;
    }

    function updateScrollProgress() {
      const isStacked = window.matchMedia("(max-width: 900px)").matches;
      const scroller = isStacked ? document.documentElement : scrollPanel;
      const top = isStacked ? window.scrollY : scrollPanel.scrollTop;
      const available = Math.max(1, scroller.scrollHeight - window.innerHeight);
      const progress = Math.min(1, top / available);
      const panelWidth = isStacked ? window.innerWidth : scrollPanel.clientWidth;
      scrollProgress.style.width = `${progress * panelWidth}px`;
    }

    videoFrame.src = `https://www.youtube-nocookie.com/embed/${youtubeVideoId}?autoplay=1&mute=1&controls=0&disablekb=1&fs=0&iv_load_policy=3&rel=0&modestbranding=1&playsinline=1&loop=1&playlist=${youtubeVideoId}`;

    scrollPanel.addEventListener("scroll", updateScrollProgress, { passive: true });
    window.addEventListener("scroll", updateScrollProgress, { passive: true });
    window.addEventListener("resize", updateScrollProgress);

    const videoResizeObserver = new ResizeObserver(fitVideoFrame);
    videoResizeObserver.observe(videoPanel);

    loadImages();
    createFloatingTexts();
    createGhostImages();
    fitVideoFrame();
    updateScrollProgress();
  </script>

</body>
</html>
