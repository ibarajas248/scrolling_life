<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080a0c">
  <title>AAAAAAAAAAAA.txt - Scrolling Life</title>
  <meta name="description" content="Una pieza de Carmen y Javi. El fondo original de INICIO, una invasion de pop-ups y el Notepad de FINAL.">
  <link rel="stylesheet" href="./styles.css?v=20260902-inicio-final">
  <script src="./assets.js" defer></script>
  <script src="./app.js?v=20260902-folder-order" defer></script>
</head>
<body>
  <main id="popup-stage" aria-label="Pieza AAAAAAAAAAAA.txt" data-phase="inicio">
    <h1 class="sr-only">AAAAAAAAAAAA.txt, Carmen + Javi</h1>
    <img class="piece-background" src="./assets/AAAAAAAAAAAA.txt/INICIO/inicio.jpg" alt="Fondo original de INICIO: escritorio con nubes y Windows Media Player" width="1918" height="911" draggable="false">
    <div id="windows" aria-label="Ventanas abiertas"></div>
    <div id="paused" class="pause-indicator" hidden>En pausa</div>
  </main>

  <nav id="start-menu" class="site-options" aria-label="Opciones de la pieza" hidden>
    <div class="site-commands">
      <button data-command="inbox" type="button" disabled><img src="./icons/mail.svg" alt="">Bandeja de entrada</button>
      <button data-command="restart" type="button"><img src="./icons/rotate-ccw.svg" alt="">Reiniciar</button>
      <button data-command="finish" type="button"><img src="./icons/file-text.svg" alt="">Finalizar sesi&oacute;n</button>
      <a href="../ruido/"><img src="./icons/log-out.svg" alt="">Volver a Ruido</a>
    </div>
    <div id="window-tabs" class="window-tabs" aria-label="Cambiar de ventana"></div>
  </nav>

  <footer class="page-controls">
    <a href="../ruido/" class="return-link">&lt; Scrolling Life</a>
    <button id="start" class="text-link" type="button" aria-expanded="false" aria-controls="start-menu">Opciones</button>
    <button id="session" class="text-link" type="button" title="Recuperar una ventana">Ventanas (<span id="window-count">00</span>)</button>
    <div class="playback-controls">
      <button id="sound" class="tray-button" type="button" title="Activar sonido" aria-label="Activar sonido" aria-pressed="false"><img src="./icons/volume-x.svg" alt=""></button>
      <button id="pause" class="tray-button" type="button" title="Pausar" aria-label="Pausar" aria-pressed="false"><img src="./icons/pause.svg" alt=""></button>
    </div>
  </footer>
  <p id="status" class="sr-only" role="status"></p>
  <noscript><p class="noscript raised">Esta pieza necesita JavaScript. <a href="../ruido/">Volver a Ruido</a></p></noscript>
</body>
</html>
