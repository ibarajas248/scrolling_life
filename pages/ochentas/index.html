<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=20260917" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0000ff" />
  <title>Ochentas</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: #0000ff;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 18%, rgba(255, 255, 255, 0.08), transparent 24%),
        #0000ff;
      cursor: crosshair;
      isolation: isolate;
    }

    .flash {
      position: absolute;
      inset: -8vmax;
      z-index: 0;
      opacity: 0.18;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.16) 0,
          rgba(255, 255, 255, 0.16) 1px,
          transparent 1px,
          transparent 5px
        );
      mix-blend-mode: screen;
      animation: scan 420ms steps(2, end) infinite;
      pointer-events: none;
    }

    .photo {
      position: absolute;
      z-index: 2;
      display: block;
      width: var(--w);
      height: var(--h);
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.9);
      background: #ffffff;
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.34),
        0 18px 32px rgba(0, 0, 0, 0.38);
      transform:
        translate3d(var(--x), var(--y), 0)
        rotate(var(--r))
        scale(0.28);
      opacity: 0;
      filter: saturate(1.2) contrast(1.08);
      animation: pop 170ms cubic-bezier(0.2, 0.9, 0.1, 1.2) forwards;
      will-change: transform, opacity;
    }

    .photo:nth-child(3n) {
      mix-blend-mode: hard-light;
    }

    .photo:nth-child(4n) {
      mix-blend-mode: normal;
      filter: saturate(1.35) contrast(1.16);
    }

    .counter {
      position: fixed;
      right: 12px;
      bottom: 10px;
      z-index: 5;
      padding: 4px 6px;
      color: rgba(255, 255, 255, 0.82);
      background: rgba(0, 0, 120, 0.52);
      font-family: "Courier New", monospace;
      font-size: 12px;
      line-height: 1;
      pointer-events: none;
    }

    @keyframes pop {
      60% {
        opacity: 1;
        transform:
          translate3d(var(--x), var(--y), 0)
          rotate(var(--r))
          scale(1.06);
      }

      100% {
        opacity: 1;
        transform:
          translate3d(var(--x), var(--y), 0)
          rotate(var(--r))
          scale(1);
      }
    }

    @keyframes scan {
      from { transform: translate3d(0, -8px, 0); }
      to { transform: translate3d(0, 8px, 0); }
    }

    @media (max-width: 760px) {
      .counter {
        font-size: 11px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .photo,
      .flash {
        animation: none;
      }

      .photo {
        opacity: 1;
        transform: translate3d(var(--x), var(--y), 0) rotate(var(--r)) scale(1);
      }
    }
  </style>
  <script src="../../assets/scripts/maintenance-gate.js" defer></script>
</head>
<body>
  <main class="stage" id="stage" aria-label="Imagenes de referencia visual de los anos ochenta apareciendo a gran velocidad">
    <div class="flash" aria-hidden="true"></div>
    <output class="counter" id="counter" aria-live="polite">000</output>
  </main>

  <script>
    const stage = document.getElementById("stage");
    const counter = document.getElementById("counter");
    const datasetPath = "../../datasets/people_80s_style_compressed/";
    const manifestPath = `${datasetPath}manifest.json`;
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    let manifest = [];
    let placed = 0;
    let targetCount = 0;
    let timer = 0;

    function random(min, max) {
      return min + Math.random() * (max - min);
    }

    function shuffle(items) {
      return [...items].sort(() => Math.random() - 0.5);
    }

    function getTargetCount() {
      const area = window.innerWidth * window.innerHeight;
      return Math.min(260, Math.max(80, Math.ceil(area / 5200)));
    }

    function spawnPhoto() {
      if (!manifest.length || placed >= targetCount) {
        window.clearInterval(timer);
        return;
      }

      const item = manifest[placed % manifest.length];
      const img = document.createElement("img");
      const base = random(96, Math.min(230, window.innerWidth * 0.42));
      const ratio = item.width && item.height ? item.height / item.width : random(0.72, 1.32);
      const width = Math.round(base * random(0.86, 1.42));
      const height = Math.round(width * Math.min(1.55, Math.max(0.58, ratio)));
      const x = Math.round(random(-width * 0.28, window.innerWidth - width * 0.72));
      const y = Math.round(random(-height * 0.22, window.innerHeight - height * 0.78));

      img.className = "photo";
      img.src = datasetPath + encodeURIComponent(item.file);
      img.alt = "";
      img.loading = "eager";
      img.decoding = "async";
      img.style.setProperty("--w", `${width}px`);
      img.style.setProperty("--h", `${height}px`);
      img.style.setProperty("--x", `${x}px`);
      img.style.setProperty("--y", `${y}px`);
      img.style.setProperty("--r", `${random(-18, 18).toFixed(2)}deg`);
      img.style.zIndex = String(2 + placed);

      stage.appendChild(img);
      placed += 1;
      counter.value = String(placed).padStart(3, "0");
    }

    function start() {
      placed = 0;
      targetCount = getTargetCount();
      counter.value = "000";
      stage.querySelectorAll(".photo").forEach((node) => node.remove());

      const batch = reduceMotion ? 10 : 3;
      const delay = reduceMotion ? 80 : 18;
      timer = window.setInterval(() => {
        for (let i = 0; i < batch; i += 1) {
          spawnPhoto();
        }
      }, delay);
    }

    async function init() {
      const response = await fetch(manifestPath, { cache: "no-store" });
      manifest = shuffle(await response.json());
      start();
    }

    window.addEventListener("resize", () => {
      window.clearInterval(timer);
      start();
    });

    stage.addEventListener("click", start);
    init();
  </script>
  <script src="/assets/scripts/traffic-tracker.js" defer></script>
</body>
</html>
