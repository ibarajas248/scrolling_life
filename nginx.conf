server {
  listen 80;
  server_name cathtest.scrollinglife.com;
  server_tokens off;

  root /usr/share/nginx/html/private-reviews/cath;
  index index.html;

  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'none'; font-src 'self'; form-action 'none'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;

  location = / {
    try_files /index.html =404;
  }

  location = /index.html {
    try_files $uri =404;
  }

  location ~* \.(?:css|js|gif|png|jpg|jpeg|svg|woff2?)$ {
    add_header Cache-Control "private, max-age=300" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'none'; font-src 'self'; form-action 'none'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    try_files $uri =404;
  }

  location / {
    return 404;
  }
}

server {
  listen 80;
  server_name scrollinglife.com www.scrollinglife.com _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/graph {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $graph_backend graph_backend:8092;
    proxy_pass http://$graph_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /site-status.json {
    add_header Cache-Control "no-store" always;
  }

  location ^~ /private-reviews/ {
    return 404;
  }

  location ~* \.(?:css|js|mjs|json|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }
}
