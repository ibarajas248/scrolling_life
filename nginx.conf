server {
  listen 80;
  server_name scrollinglife.com www.scrollinglife.com _;

  root /usr/share/nginx/html;
  index index.html;

  # Redirect only the original request, never an internal index lookup.
  if ($request_uri ~ "^([^?]*/)index\.html(?:\?|$)") {
    return 301 $1$is_args$args;
  }
  if ($request_uri ~ "^([^?]+)\.html(?:\?|$)") {
    return 301 $1$is_args$args;
  }

  location = /bot {
    add_header Cache-Control "no-store" always;
    try_files /bot/index.html =404;
  }

  location = /bot/stream {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $bot_backend wikipedia_bot:8094;
    proxy_pass http://$bot_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 75s;
    proxy_send_timeout 30s;
  }

  location ^~ /bot/ {
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ =404;
  }

  location /api/graph {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $graph_backend graph_backend:8092;
    proxy_pass http://$graph_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  location = /api/input {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $input_backend escritura_colectiva:8080;
    proxy_pass http://$input_backend;
    client_max_body_size 32k;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /api/lienzo {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $lienzo_backend escritura_colectiva:8080;
    proxy_pass http://$lienzo_backend;
    client_max_body_size 2m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location = /pages/poema-ia {
    return 404;
  }

  location ^~ /pages/poema-ia/ {
    return 404;
  }

  location = /site-status.json {
    add_header Cache-Control "no-store" always;
  }

  location ^~ /private-reviews/ {
    return 404;
  }

  location ~* \.(?:css|js|mjs|json|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }
}
