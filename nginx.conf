server {
  listen 80;
  server_name scrollinglife.com www.scrollinglife.com _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/graph {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $graph_backend graph_backend:8092;
    proxy_pass http://$graph_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /site-status.json {
    add_header Cache-Control "no-store" always;
  }

  location ~* \.(?:css|js|mjs|json|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }
}
