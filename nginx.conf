server {
  listen 80;
  server_name scrollinglife.com www.scrollinglife.com _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml;

  location /api/graph {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $graph_backend graph_backend:8092;
    proxy_pass http://$graph_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /pages/poema-ia {
    return 404;
  }

  location ^~ /pages/poema-ia/ {
    return 404;
  }

  location = /site-status.json {
    add_header Cache-Control "no-store" always;
  }

  location ^~ /private-reviews/ {
    return 404;
  }

  location ~* \.(?:css|js|mjs|json|png|jpg|jpeg|gif|webp|svg|ico|woff2?|mp4|mov|webm)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }
}
